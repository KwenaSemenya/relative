<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before first paint so the page never flashes the wrong mode.
			// Stored choice wins; otherwise follow the system.
			(function () {
				try {
					var m = localStorage.getItem('relative.mode');
					if (m !== 'dark' && m !== 'light') {
						m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.setAttribute('data-mode', m);
				} catch (e) {
					document.documentElement.setAttribute('data-mode', 'light');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
