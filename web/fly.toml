app = "relative-web"
primary_region = "lhr"

[build]

[env]
PORT = "8080"
# Reached over Fly private networking, so the API stays off the public internet.
# .flycast, not .internal: .internal resolves straight to the machine and skips
# the Fly proxy, so a request could never wake the API once it scaled to zero.
# .flycast routes through the proxy, which starts it on demand and is still
# private — the address is a private ingress IP with no public route.
RELATIVE_API_URL = "http://relative-api.flycast:8080"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
